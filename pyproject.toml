[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ics-hardening"
version = "2.0.0"
description = "Industrial Control Systems (ICS), IoT & OT Security Hardening Framework — Tools, Assessments, Compliance & Monitoring"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Ali AlEnezi", email = "site@hotmail.com"}
]
keywords = [
    "ics", "iot", "ot", "scada", "security", "hardening", "industrial",
    "cybersecurity", "plc", "hmi", "modbus", "dnp3", "opc-ua", "iec62443",
    "nist", "nerc-cip", "compliance", "vulnerability-scanner", "purdue-model"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "tabulate>=0.9",
    "python-nmap>=0.7",
    "scapy>=2.5",
    "requests>=2.28",
    "colorama>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "black>=23.0",
    "mypy>=1.0",
    "bandit>=1.7",
    "pre-commit>=3.0",
]
ml = [
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "numpy>=1.24",
]
full = [
    "ics-hardening[dev,ml]",
    "shodan>=1.28",
    "censys>=2.0",
]

[project.urls]
Homepage = "https://github.com/SiteQ8/ics-iot-ot-hardening"
Documentation = "https://siteq8.github.io/ics-iot-ot-hardening/"
Repository = "https://github.com/SiteQ8/ics-iot-ot-hardening"
Issues = "https://github.com/SiteQ8/ics-iot-ot-hardening/issues"

[project.scripts]
ics-harden = "ics_hardening.cli:main"
ics-scan = "ics_hardening.cli:scan"
ics-comply = "ics_hardening.cli:comply"
ics-monitor = "ics_hardening.cli:monitor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ics_hardening --cov-report=html"
