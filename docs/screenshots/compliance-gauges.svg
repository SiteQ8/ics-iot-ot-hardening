    <text x="80" y="175" fill="#5a6e87" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="0.5">MITRE ATT&amp;CK ICS</text>
    <text x="80" y="190" fill="#ff3860" font-family="monospace" font-size="8" text-anchor="middle">GAPS FOUND</text>
  </g>

  <!-- Gauge 5: CIS v8 - 79% -->
  <g transform="translate(820,70)">
