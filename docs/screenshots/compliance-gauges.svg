    <text x="80" y="97" fill="#e8f0fa" font-family="system-ui" font-weight="700" font-size="22" text-anchor="middle">82%</text>
    <text x="80" y="175" fill="#5a6e87" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="0.5">NIST SP 800-82</text>
    <text x="80" y="190" fill="#23d160" font-family="monospace" font-size="8" text-anchor="middle">COMPLIANT</text>
  </g>

  <!-- Gauge 3: NERC CIP - 71% -->
  <g transform="translate(440,70)">
    <rect width="160" height="200" rx="10" fill="#0f1520" stroke="#1e2a40"/>
    <circle cx="80" cy="90" r="52" fill="none" stroke="#1a2236" stroke-width="8"/>
    <circle cx="80" cy="90" r="52" fill="none" stroke="#ffb347" stroke-width="8" stroke-linecap="round"
