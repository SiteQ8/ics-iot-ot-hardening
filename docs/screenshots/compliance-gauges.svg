    <text x="80" y="97" fill="#e8f0fa" font-family="system-ui" font-weight="700" font-size="22" text-anchor="middle">71%</text>
    <text x="80" y="175" fill="#5a6e87" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="0.5">NERC CIP</text>
    <text x="80" y="190" fill="#ffb347" font-family="monospace" font-size="8" text-anchor="middle">PARTIAL</text>
  </g>

  <!-- Gauge 4: MITRE ATT&CK - 65% -->
  <g transform="translate(630,70)">
    <rect width="160" height="200" rx="10" fill="#0f1520" stroke="#1e2a40"/>
    <circle cx="80" cy="90" r="52" fill="none" stroke="#1a2236" stroke-width="8"/>
