    <text x="16" y="94" fill="#00f0ff">  ╩╚═╝╚═╝  ╩ ╩╩ ╩╩╚══╩╝╚═╝╝╚╝╩╝╚╝╚═╝</text>
    <text x="16" y="114" fill="#5a6e87">  Industrial Security Framework v2.0</text>
    <text x="16" y="130" fill="#5a6e87">  by Ali AlEnezi (SiteQ8) — Made in Kuwait 🇰🇼</text>
    <text x="16" y="158" fill="#e8f0fa">Usage: ics-harden [OPTIONS] COMMAND [ARGS]...</text>
    <text x="16" y="182" fill="#5a6e87">  ICS/IoT/OT Hardening Framework — Industrial Security Operations Center.</text>
    <text x="16" y="206" fill="#e8f0fa">Options:</text>
    <text x="16" y="224" fill="#23d160">  --version</text><text x="200" y="224" fill="#5a6e87">Show the version and exit.</text>
    <text x="16" y="240" fill="#23d160">  --help</text><text x="200" y="240" fill="#5a6e87">Show this message and exit.</text>
    <text x="16" y="264" fill="#e8f0fa">Commands:</text>
    <text x="16" y="282" fill="#00f0ff">  assess</text><text x="200" y="282" fill="#5a6e87">Run comprehensive ICS security assessment</text>
    <text x="16" y="298" fill="#00f0ff">  assets</text><text x="200" y="298" fill="#5a6e87">Discover and inventory ICS/OT assets</text>
    <text x="16" y="314" fill="#00f0ff">  harden</text><text x="200" y="314" fill="#5a6e87">Apply hardening configurations to ICS environment</text>
    <text x="16" y="330" fill="#00f0ff">  network</text><text x="200" y="330" fill="#5a6e87">Analyze and validate network segmentation</text>
    <text x="16" y="346" fill="#00f0ff">  report</text><text x="200" y="346" fill="#5a6e87">Generate multi-standard compliance report</text>
    <text x="16" y="374"><tspan fill="#00f0ff">$ </tspan><tspan fill="#e8f0fa">pip install ics-hardening</tspan><tspan fill="#5a6e87">   # Install from PyPI</tspan></text>
    <text x="16" y="390"><tspan fill="#00f0ff">$ </tspan><tspan fill="#e8f0fa">ics-harden assess -t 10.0.0.0/16 -l deep</tspan></text>
